# Laika configuration for the task-oriented guides.
#
# README.md is Laika's title document for a directory, so the section's name in
# the sidebar comes from its first heading and is not repeated here.
#
# The reading order is the numeric prefix on each file, which is also what an
# alphabetical sort produces — the prefixes are zero-padded for exactly that
# reason. The list below states it anyway, so that a guide added without a
# prefix lands at the end rather than in the middle.

laika.navigationOrder = [
  01-getting-started.md
  02-authentication.md
  03-errors.md
  04-pagination.md
  05-retries-and-rate-limits.md
  06-observability.md
  07-testing-your-code.md
  08-writing-data.md
  09-self-hosted.md
  10-troubleshooting.md
]
