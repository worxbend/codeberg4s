# Laika configuration for the lookup pages.
#
# README.md is Laika's title document for a directory, so the section's name in
# the sidebar comes from its first heading and is not repeated here.
#
# The order is deliberate rather than alphabetical: the API groups are what a
# reader comes here for, the glossary explains the words those pages use, and
# the FAQ is the one page meant to be read rather than looked up.

laika.navigationOrder = [
  api-groups.md
  glossary.md
  faq.md
]
