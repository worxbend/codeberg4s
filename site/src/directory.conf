# Laika configuration for the root of the documentation tree.
#
# Everything that is a *theme* decision lives in site/build/laika.scala instead;
# this file holds only what is a property of the content tree itself.

laika.title = codeberg4s

# Sidebar order. Entries not listed here are appended alphabetically, so a new
# guide appears without editing this file — but the five top-level sections keep
# a deliberate reading order rather than an alphabetical one.
#
# `guides`, `reference` and `project` are directories. `guides` and `reference`
# are written by a different work stream; `project` is copied out of docs/ by
# scripts/site.sh. If one of them is missing, Laika ignores the entry rather
# than failing, and scripts/site.sh prints a warning naming what it generated in
# its place.
#
# `landing-page.md` is deliberately absent from this list. Helium lifts that file
# out of the content tree and renders it as the site's landing page, so it is not
# a sidebar entry — see the note above `homeLink` in site/build/laika.scala.
laika.navigationOrder = [
  getting-started.md
  guides
  reference
  examples.md
  project
]
