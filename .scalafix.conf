// Semantic rules for codeberg4s. See SCALA_CODE_STYLE.md § Scalafix Rules.
// Run with: ./mill __.fix

rules = [
  ExplicitResultTypes
  DisableSyntax
  NoValInForComprehension
  OrganizeImports
  RedundantSyntax
  NoAutoTupling
]

ExplicitResultTypes {
  memberVisibility  = [Public, Protected]
  skipSimpleDefinitions = false
  fatalWarnings     = true
}

DisableSyntax {
  noVars           = true
  noThrows         = true
  noNulls          = true
  noReturns        = true
  noDefaultArgs    = true
  noFinalize       = true
  noValPatterns    = true
  noUniversalEquality = true
  noAsInstanceOf   = true
  noIsInstanceOf   = true
  noXml            = true
  regex = [
    {
      // DisableSyntax.regex matches raw file text, so it cannot tell code from
      // prose, and this codebase's Scaladoc is full of legitimate `.get`:
      // operation ids such as "repos.get" and method references such as
      // `client.organizations.get`. The lookahead therefore skips a `.get`
      // followed by one of four documentation delimiters:
      //   (   an ordinary method call
      //   "   the end of an operation id such as "users.get"
      //   `   a Scaladoc code span, how identifiers are written here
      //   ]   a Scaladoc link, as in [[UserApi.get]]
      //
      // Real Option#get is followed by whitespace, `)`, `.`, `,` or a newline,
      // so it is still caught. The residual blind spot is a bare, undelimited
      // `.get` in prose; that is a documentation-style problem, and the
      // alternative — deleting the rule — loses a genuine safety check.
      id      = "noOptionGet"
      pattern = """\.get\b(?!["(`\]])"""
      message = "Option#get is banned — pattern match, or use a type that proves presence."
    }
    {
      id      = "noPrintln"
      pattern = "\\bprintln\\("
      message = "Use a logger, never println."
    }
  ]
}

// Order per SCALA_CODE_STYLE.md § Imports: worxbend, ecosystem, third-party, scala, java.
OrganizeImports {
  targetDialect     = Scala3
  removeUnused      = true
  expandRelative    = true
  groupedImports    = Explode
  importsOrder      = Ascii
  blankLines        = Auto
  groups = [
    "com.worxbend."
    "ox."
    "sttp."
    "re:^(?!com\\.worxbend\\.|ox\\.|sttp\\.|scala\\.|java\\.|javax\\.).*"
    "scala."
    "java."
    "javax."
  ]
}
