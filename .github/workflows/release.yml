name: Release

# Publishes the five artifacts to Maven Central when a v* tag is pushed.
#
# Nothing here decides what the version is. `Publish.version` in build.mill is
# the version; the tag only says "publish that". The guard below refuses to run
# when the two disagree, because a tag that does not match the artifact it
# produces is unresolvable archaeology six months later.
#
# The full procedure — how to set the version, how the key and credentials are
# produced, how to verify the release landed, what to do about a bad one — is
# in RELEASING.md. This file is that document made executable.
#
# Every third-party action below is pinned to a full commit SHA, with the
# release it belongs to in a trailing comment so the line stays readable. A tag
# like `v7` is a mutable pointer: whoever controls the action's repository can
# move it to different code at any time, and this job would fetch and run that
# code with MILL_PGP_SECRET_BASE64 — the signing key — in its environment.
# A commit SHA cannot be moved. `.github/dependabot.yml` opens a pull request
# when a pinned action publishes a new release, so the pins are reviewed and
# moved forward deliberately instead of quietly ageing.
#
# `./.github/actions/scala-toolchain` is exempt because it is not fetched from
# anywhere: a `uses:` beginning with `./` runs the copy in this repository at
# the commit being built, so it is already pinned by the checkout above.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    # A fork that happens to carry the tags must never publish under this
    # group id, no matter what secrets its owner configured. The upstream
    # repository is the only place a release can come from.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      # Protect this environment in repository settings with a required
      # reviewer. It is the last human checkpoint before an immutable
      # artifact reaches Central.
      name: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/scala-toolchain

      # The tag is a claim about the build. Check the claim before spending an
      # hour on it, and long before anything is signed.
      - name: Tag must match Publish.version in build.mill
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared=$(sed -n 's/^[[:space:]]*val version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.mill | head -1)
          echo "tag      $tag"
          echo "build.mill $declared"
          if [ -z "$declared" ]; then
            echo "could not read Publish.version from build.mill" >&2
            exit 1
          fi
          if [ "$tag" != "$declared" ]; then
            echo "refusing to publish: tag v$tag does not match Publish.version $declared" >&2
            echo "set Publish.version, commit it, then tag that commit — see RELEASING.md" >&2
            exit 1
          fi
          case "$declared" in
            *-SNAPSHOT)
              echo "refusing to publish: $declared is a snapshot version" >&2
              echo "a v* tag is a release; drop the -SNAPSHOT suffix first" >&2
              exit 1
              ;;
          esac

      # The same gate every push runs. A release is not exempt from it; it is
      # the one build that most needs it.
      - name: Verify
        run: ./verify.sh

      # Binary compatibility against the releases named in
      # `Publish.binaryCompatibleWith`. RELEASING.md § "Binary compatibility is
      # checked by MIMA" is why this is not in verify.sh: it downloads the
      # previous artifacts from Maven Central, and the fast gate runs offline.
      # A release is the one build that must not skip it, so it runs here,
      # before anything is signed.
      #
      # While that list is `Seq.empty` — until the first release is on Central —
      # there is nothing to compare against and the plugin fails with its own
      # "No previous artifacts configured", which would block `0.1.0` on a check
      # that cannot run. The step reads the list's declaration out of build.mill
      # and, when it is empty, says so in the run summary and skips. It refuses
      # to guess: if the declaration cannot be found at all, that is a failure,
      # because a renamed list would otherwise turn the check off for good.
      - name: Binary compatibility (MIMA)
        run: |
          set -euo pipefail
          declaration=$(grep -E '^[[:space:]]*val binaryCompatibleWith[[:space:]]*:[[:space:]]*Seq\[String\][[:space:]]*=' build.mill || true)
          if [ -z "$declaration" ]; then
            echo "could not find \`val binaryCompatibleWith: Seq[String] = …\` in build.mill" >&2
            echo "the MIMA step reads that declaration to decide whether there is a release to compare against — restore it or update this step" >&2
            exit 1
          fi
          echo "build.mill: $declaration"
          if grep -qE '=[[:space:]]*Seq\.empty[[:space:]]*$' <<<"$declaration"; then
            {
              echo "## Binary compatibility: skipped"
              echo
              echo "\`Publish.binaryCompatibleWith\` is \`Seq.empty\`, so no released version exists to"
              echo "compare against and MIMA was not run. This is expected for the first release only;"
              echo "the follow-up commit that moves \`main\` to the next \`-SNAPSHOT\` adds the version just"
              echo "released to that list (RELEASING.md § \"Verifying the release landed\")."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Publish.binaryCompatibleWith is Seq.empty — nothing to compare against; MIMA skipped."
            exit 0
          fi
          ./mill modules.__.mimaReportBinaryIssues
          {
            echo "## Binary compatibility: checked"
            echo
            echo "\`./mill modules.__.mimaReportBinaryIssues\` found no incompatibility with:"
            echo
            echo '```scala'
            echo "$declaration"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # publishAll resolves __:PublishModule.publishArtifacts — every
      # PublishModule in the build, which is exactly the five library modules.
      # modules.it is not a PublishModule, so integration tests cannot leak
      # into a release. Each module pushes four files plus signatures and
      # checksums: the pom, the main jar, -sources.jar and -javadoc.jar.
      #
      # Mill reads all four credentials from the environment. They are not
      # passed as command-line arguments, which would put them in the process
      # table and in Mill's own logs.
      - name: Publish
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.PGP_SECRET_BASE64 }}
          MILL_PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          set -euo pipefail
          for name in MILL_SONATYPE_USERNAME MILL_SONATYPE_PASSWORD MILL_PGP_SECRET_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "$name is empty — the corresponding repository secret is not set." >&2
              echo "See RELEASING.md § Credentials." >&2
              exit 1
            fi
          done
          ./mill mill.javalib.SonatypeCentralPublishModule/publishAll
