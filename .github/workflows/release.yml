name: Release

on:
  push:
    tags: ["v*"]
  # Choose the existing release tag in the Run workflow ref selector.
  workflow_dispatch:
    inputs:
      release:
        description: Automatically release the validated Central deployment
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: central-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Require a release tag
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$GITHUB_REF_TYPE" = tag

  validate:
    needs: tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.validated-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/scala-toolchain
      - name: Tag, validated commit, versions and com.worxbend coordinates agree
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated-sha }}
        run: python3 .github/scripts/validate-release.py
      - name: Binary compatibility (MIMA)
        run: |
          set -euo pipefail
          declaration=$(grep -E '^[[:space:]]*val binaryCompatibleWith[[:space:]]*:[[:space:]]*Seq\[String\][[:space:]]*=' build.mill || true)
          if [ -z "$declaration" ]; then
            echo "could not find \`val binaryCompatibleWith: Seq[String] = …\` in build.mill" >&2
            echo "the MIMA step reads that declaration to decide whether there is a release to compare against — restore it or update this step" >&2
            exit 1
          fi
          echo "build.mill: $declaration"
          if grep -qE '=[[:space:]]*Seq\.empty[[:space:]]*$' <<<"$declaration"; then
            {
              echo "## Binary compatibility: skipped"
              echo
              echo "\`Publish.binaryCompatibleWith\` is \`Seq.empty\`, so no released version exists to"
              echo "compare against and MIMA was not run. This is expected for the first release only;"
              echo "the follow-up commit that moves \`main\` to the next \`-SNAPSHOT\` adds the version just"
              echo "released to that list (RELEASING.md § \"Verifying the release landed\")."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Publish.binaryCompatibleWith is Seq.empty — nothing to compare against; MIMA skipped."
            exit 0
          fi
          ./mill modules.__.mimaReportBinaryIssues
          {
            echo "## Binary compatibility: checked"
            echo
            echo "\`./mill modules.__.mimaReportBinaryIssues\` found no incompatibility with:"
            echo
            echo '```scala'
            echo "$declaration"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publishing credentials are present
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.MILL_SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.MILL_SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
          MILL_PGP_PASSPHRASE: ${{ secrets.MILL_PGP_PASSPHRASE }}
        run: |
          missing=""
          for name in MILL_SONATYPE_USERNAME MILL_SONATYPE_PASSWORD MILL_PGP_SECRET_BASE64 MILL_PGP_PASSPHRASE; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository publishing secrets:$missing"
            exit 1
          fi
      - name: Publish signed libraries to Maven Central
        timeout-minutes: 25
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.MILL_SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.MILL_SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
          MILL_PGP_PASSPHRASE: ${{ secrets.MILL_PGP_PASSPHRASE }}
          SHOULD_RELEASE: ${{ github.event_name == 'push' || inputs.release }}
        run: |
          ./mill mill.javalib.SonatypeCentralPublishModule/publishAll \
            --publishArtifacts 'modules.{domain,core,codec,transport,client}.publishArtifacts' \
            --shouldRelease "$SHOULD_RELEASE" --awaitTimeout 1200000
      - name: Verify every public Central POM and jar
        if: github.event_name == 'push' || inputs.release
        timeout-minutes: 20
        run: python3 .github/scripts/verify-published.py https://repo.maven.apache.org/maven2
