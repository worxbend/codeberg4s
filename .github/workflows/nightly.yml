name: Nightly

# The slow half of the quality gate, plus the spec-drift detector.
#
# Duplication (PMD CPD), CRAP and mutation testing are minutes-to-hours of work.
# Running them per push would make CI useless as a feedback loop, so they run
# once a night — PLAN.md §6.6 step 7.
#
# The spec-drift job used to live in .forgejo/workflows/ci.yml, gated on a
# `schedule` event that workflow never declared, so it had never run. It lives
# here now rather than in both places: two copies of a drift detector are two
# things to keep in step, and the one that matters is the one that actually
# fires.
#
# The property suites used to have a job here as well. They run on every push
# and pull request now (`properties` in ci.yml): a ScalaCheck suite with a
# pinned seed is deterministic, so a nightly re-run of the same commit added
# nothing, and a job that only ran at 03:00 let a broken property sit unseen
# for a day. See verify.sh's header for what `--properties` is.
#
# Two jobs share the slow analysis, on purpose. `with-slow` runs duplication
# and CRAP and MUST be green — both gates pass today, so red there is a real
# regression. `mutation` runs `--nightly`, which ends in Stryker4s, and that is
# expected to fail until the plugin is wired (see the job). Keeping them apart
# is what lets the first say something: when both lived in one job, the
# mutation step's certain failure turned every nightly red, and a gate that is
# always red is one nobody reads.

on:
  schedule:
    # 03:00 UTC. Late enough that the day's pushes have settled, early enough
    # that a red nightly is waiting when Europe wakes up.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  with-slow:
    name: verify.sh --with-slow
    # GitHub disables scheduled workflows in forks, but workflow_dispatch is
    # not disabled, so the guard is not redundant.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    # The fast gate is given 45 minutes from a cold cache (ci.yml). CPD adds
    # one PMD download and CRAP one more scala-cli script on top; 90 is
    # generous, and a run that takes longer has hung.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/scala-toolchain
        with:
          cache-prefix: coursier-nightly

      # Everything the fast gate runs, then duplication against its recorded
      # baseline (CPD_BASELINE_GROUPS in verify.sh) and CRAP against its limit.
      # This is the only place those two gates run, so this job has to be green
      # and is not marked continue-on-error anywhere.
      - name: Slow analysis
        run: ./verify.sh --with-slow

  mutation:
    name: verify.sh --nightly (mutation testing)
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    # Stryker4s runs the test command once per mutant. If a real score is ever
    # produced for this repository it will be hours, not minutes.
    timeout-minutes: 360
    # EXPECTED TO FAIL TODAY, and the reason is written into the run's summary
    # by the last step rather than left for someone to rediscover in the log.
    #
    # `--nightly` implies `--with-slow`, so this job repeats the gates the job
    # above ran and then reaches mutation testing, which fails: scripts/mutate.sh
    # refuses to exit 0 without a real mutation score, and build.mill does not
    # yet declare the Stryker4s Mill plugin. See docs/ROADMAP.md Phase 4 and
    # docs/CONSTITUTION_MAPPING.md § "Stryker4s".
    #
    # continue-on-error keeps that certain failure from deciding the whole
    # run's result, so that the `with-slow` and `spec-drift` jobs beside it can
    # be read at a glance. It is NOT a claim that mutation testing passed: the
    # job is still reported as failed, its summary says why, and the day the
    # plugin is wired this line comes out in the same commit so the gate means
    # something again. A green tick on a job that had produced no score would
    # be a lie; a failed job whose summary says "no score yet" is the truth.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/scala-toolchain
        with:
          # Same footprint as the job above — the fast gate plus PMD and the
          # scala-cli scripts — so the same cache lane.
          cache-prefix: coursier-nightly

      - name: Mutation testing
        id: mutate
        run: ./verify.sh --nightly

      - name: Say why the job is red
        if: always()
        env:
          OUTCOME: ${{ steps.mutate.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "success" ]; then
            {
              echo "## Mutation testing produced a score"
              echo
              echo "\`./verify.sh --nightly\` exited 0, which means \`scripts/mutate.sh\` reported a real"
              echo "mutation score above its threshold. Remove \`continue-on-error: true\` from the"
              echo "\`mutation\` job in \`.github/workflows/nightly.yml\` so a future regression fails"
              echo "the nightly again, and move the Stryker4s row in \`docs/CONSTITUTION_MAPPING.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Mutation testing is red, and is expected to be"
            echo
            echo "\`./verify.sh --nightly\` ends in \`scripts/mutate.sh\`, which refuses to exit 0"
            echo "without a real mutation score, and \`build.mill\` does not yet declare the"
            echo "Stryker4s Mill plugin — so no score has ever been produced for this repository."
            echo "This job carries \`continue-on-error: true\` so that its certain failure does not"
            echo "hide the result of the \`with-slow\` and \`spec-drift\` jobs, which must be green."
            echo
            echo "Nothing about this outcome is a pass. The step above it — duplication against"
            echo "its baseline and CRAP — is what the \`with-slow\` job reports on separately."
            echo
            echo "What wires it: the two \`build.mill\` lines and the run described in"
            echo "\`docs/CONSTITUTION_MAPPING.md\` § \"Stryker4s\" and \`docs/ROADMAP.md\` Phase 4."
          } >> "$GITHUB_STEP_SUMMARY"

  spec-drift:
    name: Spec drift
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pinned spec is a snapshot of a moving target. This does not fail
      # the build when Codeberg deploys a new Forgejo — it reports, so that a
      # spec change is a decision someone makes rather than a surprise in a
      # user's application. See docs/adr/0001-curated-models-over-codegen.md
      # and docs/SPEC_PROVENANCE.md.
      #
      # Two things it is honest about: the models are built from captured
      # fixtures, not from this spec (docs/HAZARDS.md records where the two
      # disagree), so a drift here is a prompt to re-probe rather than a defect
      # report. And the diff is truncated, because the spec is 326 paths long.
      - name: Compare the live spec against the pinned copy
        run: |
          set -euo pipefail
          curl -sSLf https://codeberg.org/swagger.v1.json -o "$RUNNER_TEMP/live.json"
          pinned=$(sha256sum spec/swagger.v1.json | cut -d' ' -f1)
          live=$(sha256sum "$RUNNER_TEMP/live.json" | cut -d' ' -f1)
          if [ "$pinned" = "$live" ]; then
            echo "spec unchanged ($pinned)"
            echo "The pinned spec still matches codeberg.org." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::the upstream spec has changed"
          {
            echo "## The upstream Forgejo spec has changed"
            echo
            echo "| | sha256 |"
            echo "| --- | --- |"
            echo "| pinned (\`spec/swagger.v1.json\`) | \`$pinned\` |"
            echo "| live (codeberg.org) | \`$live\` |"
            echo
            echo "Re-pinning is a deliberate act: it changes"
            echo "\`docs/API_INVENTORY.md\`, \`docs/SPEC_PROVENANCE.md\` and possibly the"
            echo "in-scope operation count. See docs/adr/0001-curated-models-over-codegen.md."
            echo
            echo '<details><summary>First 200 diff lines</summary>'
            echo
            echo '```diff'
            diff <(python3 -m json.tool spec/swagger.v1.json) \
                 <(python3 -m json.tool "$RUNNER_TEMP/live.json") | head -200 || true
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the live spec for comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-swagger-${{ github.run_id }}
          path: ${{ runner.temp }}/live.json
          if-no-files-found: ignore
          retention-days: 30
