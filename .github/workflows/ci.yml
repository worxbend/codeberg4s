name: CI

# ./verify.sh is the single source of truth for what CI checks.
#
# This workflow deliberately contains no `mill` invocation of its own. Every
# gate — scalafmt, scalafix, the zero-warning compile, the unit suite, the
# architecture-boundary grep, coverage — lives in verify.sh, so a contributor
# who runs `./verify.sh` locally runs exactly what CI runs. The moment a check
# is added here instead of there, the two drift and "green on my machine"
# stops meaning anything. Add checks to verify.sh; leave this file alone.
#
# Two jobs, two modes of the same script. `verify` is `./verify.sh`, the
# routine gate. `properties` is `./verify.sh --properties`, the ScalaCheck
# suites the routine gate deliberately excludes (verify.sh's header says why
# they are separated). They are separate jobs rather than two steps because
# each is a result worth reading on its own — a red property is a different
# finding from a red unit test — and because the two runs are independent, so
# they may as well overlap.

on:
  workflow_call:
    outputs:
      validated-sha:
        description: Commit checked by the complete CI workflow
        value: ${{ jobs.verify.outputs.validated-sha }}
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer worthless.
# main is excluded from cancellation because its history is what nightly and
# release runs are judged against.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    outputs:
      validated-sha: ${{ steps.commit.outputs.sha }}
    name: verify.sh
    runs-on: ubuntu-latest
    # The fast gate compiles five modules and runs ~3500 tests from a cold
    # Coursier cache on a cache miss. 45 minutes is generous; a run that takes
    # longer has hung, not slowed down.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # verify.sh's scalafmt step asks Git which Scala sources are tracked
          # (.scalafmt.conf sets project.git = true). A shallow checkout is
          # enough for that, but the working tree must be a real repository.
          persist-credentials: false
          fetch-depth: 1

      - name: Record validated commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/scala-toolchain

      # One job for the whole routine gate, on purpose. Splitting format,
      # compile and test across jobs would re-resolve dependencies and
      # recompile from scratch in each of them, which costs more than it saves
      # and loses verify.sh's ordering — the cheap checks are first so a
      # formatting mistake fails in seconds.
      - name: Publishing guard tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Verify
        run: ./verify.sh

      # The coverage report is the one artifact worth keeping from a pull
      # request: the gate prints a percentage, the report says which lines.
      #
      # It is XML, not HTML. verify.sh's coverage step runs
      # `mill <module>.scoverage.xmlReport` and nothing else, because XML is
      # what scripts/coverage-gate.sc and scripts/crap.sc read. Mill can also
      # render `scoverage.htmlReport`, but generating it here would mean a
      # `mill` invocation in this workflow, which the header above rules out,
      # and adding it to verify.sh would charge every local run for a page
      # nothing reads. To read a downloaded report as a web page, run
      # `./mill modules.__.scoverage.htmlReport` locally against the same
      # commit.
      #
      # The path is the report directory itself rather than the whole
      # `scoverage/` tree, which is mostly Mill's own task cache.
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scoverage-xml-${{ github.run_id }}
          path: out/modules/*/scoverage/xmlReport.dest/scoverage.xml
          if-no-files-found: ignore
          retention-days: 14

  properties:
    name: verify.sh --properties
    runs-on: ubuntu-latest
    # Nine ScalaCheck suites, compiled from a cold cache on a miss. Until
    # 2026-09-29 this job ran only in nightly.yml, which meant a property broken
    # by a pull request was found the following morning, after the merge. It
    # runs here now, on the same commit as the routine gate. 30 minutes is the
    # budget the nightly job had; the suites take a fraction of that.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ./.github/actions/scala-toolchain
        with:
          # Its own cache lane: the property run compiles the test modules but
          # never produces a coverage report, so its Coursier footprint differs
          # from the verify job's.
          cache-prefix: coursier-properties

      # `--properties` runs the suites tagged `Property` and nothing else: the
      # routine gate excludes that tag, so without this job the suites would be
      # compiled by CI and executed by nobody. The script asserts that a
      # `*Props` suite actually reported tests, so a mis-scoped tag filter
      # fails here rather than passing green with an empty run.
      - name: Property suites
        run: ./verify.sh --properties
