# Every link below points at the canonical project URL declared in build.mill
# (`Publish.projectUrl`), which is this repository on GitHub. If the project
# ever moves, build.mill and this file move together.

blank_issues_enabled: false

contact_links:
  - name: Security vulnerability — do not open an issue
    url: https://github.com/worxbend/codeberg4s/blob/main/SECURITY.md
    about: >
      A leaked credential or a redaction hole must be reported privately.
      SECURITY.md says how to reach the maintainer and what is in scope.

  - name: How do I ...?
    url: https://github.com/worxbend/codeberg4s/blob/main/README.md
    about: >
      The README covers the two error rails, pagination, configuration and
      telemetry; docs/HAZARDS.md records where Forgejo's behaviour differs
      from its own specification. If the answer is not there, that is a
      documentation bug — please file one.

  - name: What a report needs, and how changes land
    url: https://github.com/worxbend/codeberg4s/blob/main/CONTRIBUTING.md
    about: >
      The contributing guide explains the four facts that make a bug
      reproducible — instance, library version, operation id, CodebergError
      case — and how a change gets through the gate. GitHub is the project's
      only tracker; there is no second copy to search.
