name: CI

# The fast gate on the canonical remote (codeberg.org).
#
# ./verify.sh is the single source of truth for what CI checks — the same
# script a contributor runs locally and the same one .github/workflows/ci.yml
# runs. Nothing is checked here that is not checked there.
#
# The `nightly` and `spec-drift` jobs that used to live in this file have moved
# to .github/workflows/nightly.yml. Both were gated on
# `github.event_name == 'schedule'` while this workflow declared only `push`
# and `pull_request`, so neither had ever run. They are defined once, in the
# workflow that actually has a schedule, rather than maintained in two places
# and firing in neither.
#
# The two actions below are pinned to commit SHAs for the same reason the
# GitHub workflows are: a `@v4` tag can be repointed at other code by whoever
# controls the action's repository, and a SHA cannot. Read those SHAs from
# **code.forgejo.org**, not github.com — a Forgejo runner resolves a bare
# `actions/<name>` against its DEFAULT_ACTIONS_URL, which is code.forgejo.org
# on Codeberg. The comment after each SHA is the release tag that carried it
# there. An instance configured to pull actions from somewhere else needs the
# SHAs re-resolved against that forge; the tags alone would silently work and
# silently mean something different.

on:
  push:
    branches: [main]
  pull_request:

env:
  # Keep every cache inside the workspace. The constitution requires that the
  # build write nothing outside the project, and it also makes the cache key
  # below actually cover what gets restored.
  COURSIER_CACHE: ${{ github.workspace }}/.cache/coursier
  MILL_JVM_OPTS: -Xmx3g

jobs:
  verify:
    runs-on: docker
    container:
      # Must not be older than the `-java-output-version:25` in build.mill.
      # Mill provisions its own JDK from .mill-jvm-version, so the image's JDK
      # is what scala-cli and any non-Mill step run on; an older image would
      # let those two disagree without failing anything.
      image: docker.io/eclipse-temurin:25-jdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache Coursier
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/coursier
          key: coursier-${{ hashFiles('build.mill', '.mill-version', '.mill-jvm-version') }}
          restore-keys: coursier-

      # verify.sh runs scripts/coverage-gate.sc through scala-cli, so the image
      # needs scala-cli as well as a JDK. Pinned by version and checksum for
      # the same reason scripts/cpd.sh pins PMD.
      - name: Install scala-cli
        env:
          SCALA_CLI_VERSION: "1.15.0"
          SCALA_CLI_SHA256: "37b33939ff82a8730263b6c72d81e23db4987b4b399c8a403c8ece76604a30f6"
        run: |
          set -euo pipefail
          url="https://github.com/VirtusLab/scala-cli/releases/download/v${SCALA_CLI_VERSION}/scala-cli-x86_64-pc-linux.gz"
          curl -fsSL -o /tmp/scala-cli.gz "$url"
          echo "${SCALA_CLI_SHA256}  /tmp/scala-cli.gz" | sha256sum --check --strict
          gunzip -c /tmp/scala-cli.gz > /usr/local/bin/scala-cli
          chmod +x /usr/local/bin/scala-cli
          rm -f /tmp/scala-cli.gz
          scala-cli version --cli-version

      - name: Verify
        run: ./verify.sh
