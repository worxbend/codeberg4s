version = "3.11.5"
runner.dialect = scala3

maxColumn = 120   # hard limit — SCALA_CODE_STYLE.md

# ---------------------------------------------------------------------------
# Vertical alignment — the point of this config
# ---------------------------------------------------------------------------
align.preset          = most
align.multiline       = true
align.stripMargin     = true
align.arrowEnumeratorGenerator = true
align.openParenCallSite     = false
align.openParenDefnSite     = false
align.closeParenSite        = false
align.inInterpolation       = true

align.allowOverflow = false

# NOTE: at most ONE entry per `code` — a second entry with the same code
# replaces the first rather than adding to it, which silently disables it.
align.tokens."+" = [
  { code = "=",   owners = [{ regex = "Defn|Term.Assign|Enumerator" }] }
  { code = "<-" }
  { code = "->" }
  { code = "=>",  owners = [{ regex = "Case|Term.Function" }] }
  { code = "%",   owners = [{ regex = "Term.ApplyInfix" }] }
  { code = "%%",  owners = [{ regex = "Term.ApplyInfix" }] }
  { code = "%%%", owners = [{ regex = "Term.ApplyInfix" }] }
  { code = ":=" }
  { code = "++=" }
  { code = "+=" }
  { code = "|" }
  # ScalaTest / munit / utest spec DSL
  { code = "should" }
  { code = "shouldBe" }
  { code = "must" }
  { code = "in" }
]

# ---------------------------------------------------------------------------
# Line breaking
# ---------------------------------------------------------------------------
newlines.source                       = keep
newlines.topLevelStatementBlankLines  = [
  { blanks { before = 1 }, regex = "^Defn\\.(Def|Class|Trait|Object|Enum|Given)$", minBreaks = 1 }
]
newlines.beforeCurlyLambdaParams      = multilineWithCaseOnly
newlines.afterCurlyLambdaParams       = squash
newlines.implicitParamListModifierPrefer = before
newlines.avoidForSimpleOverflow       = [tooLong, punct, slc]
newlines.avoidInResultType            = true
newlines.beforeTypeBounds             = keep
newlines.alwaysBeforeElseAfterCurlyIf = false
newlines.selectChains                 = keep
newlines.inInterpolation              = avoid

optIn.annotationNewlines  = true
optIn.breakChainOnFirstMethodDot = true

# ---------------------------------------------------------------------------
# Indentation (Scala 3 friendly)
# ---------------------------------------------------------------------------
indent.main        = 2
indent.significant = 2
indent.callSite    = 2
indent.defnSite    = 4
indent.ctorSite    = 4
indent.extendSite  = 4
indent.withSiteRelativeToExtends  = 2
indent.commaSiteRelativeToExtends = 2

indentOperator.topLevelOnly = false

# ---------------------------------------------------------------------------
# Danglers / parens
# ---------------------------------------------------------------------------
danglingParentheses.defnSite       = true
danglingParentheses.callSite       = true
danglingParentheses.ctrlSite       = true
danglingParentheses.exclude        = []

verticalMultiline.atDefnSite               = false
verticalMultiline.arityThreshold           = 4
verticalMultiline.newlineAfterOpenParen    = true

# ---------------------------------------------------------------------------
# Rewrites
# ---------------------------------------------------------------------------
rewrite.rules = [
  AvoidInfix
  RedundantBraces
  RedundantParens
  SortModifiers
  PreferCurlyFors
  Imports
]

rewrite.redundantBraces.stringInterpolation = true
rewrite.redundantBraces.generalExpressions  = true
rewrite.redundantBraces.ifElseExpressions   = false
rewrite.redundantBraces.methodBodies        = true
rewrite.redundantBraces.includeUnitMethods  = false
rewrite.redundantBraces.maxBreaks           = 8

rewrite.imports.sort   = ascii
rewrite.imports.expand = false
# Order per SCALA_CODE_STYLE.md: worxbend, ecosystem, third-party, scala, java.
#
# The catch-all sits THIRD, not last, so that "other third-party" (upickle,
# munit) lands before scala/java — which is what the style guide specifies and
# what OrganizeImports in .scalafix.conf does. With the catch-all last, the two
# tools disagreed and `mill __.reformat` / `mill __.fix` moved the same imports
# back and forth forever.
#
# Putting `.*` before the scala/java groups is safe because scalafmt assigns an
# import to its LONGEST matching pattern, not its first, so `scala.util.Try`
# still lands in the `scala\..*` group. Verified against scalafmt 3.11.5.
rewrite.imports.groups = [
  ["com\\.worxbend\\..*"]
  ["ox\\..*", "sttp\\..*", "com\\.github\\.plokhotnyuk\\..*"]
  [".*"]
  ["scala\\..*"]
  ["java\\..*", "javax\\..*"]
]

rewrite.sortModifiers.preset = styleGuide

rewrite.avoidInfix.excludeFilters = [
  "should.*", "must.*", "in", "ignore", "taggedAs", "when", "which",
  "to", "until", "by", "at", "and", "or", "not", "eq", "ne"
]

# Scala 3 indentation syntax is mandatory (SCALA_CODE_STYLE.md, Non-Negotiables).
rewrite.scala3.convertToNewSyntax        = true
rewrite.scala3.removeOptionalBraces      = yes
rewrite.scala3.insertEndMarkerMinLines   = 0
rewrite.scala3.newSyntax.control         = false

rewriteTokens {
  "⇒" = "=>"
  "→" = "->"
  "←" = "<-"
}

# ---------------------------------------------------------------------------
# Docstrings & comments
# ---------------------------------------------------------------------------
docstrings.style             = SpaceAsterisk
docstrings.oneline           = fold
docstrings.wrap              = yes
docstrings.blankFirstLine    = no
docstrings.forceBlankLineBefore = true

comments.wrap      = no
comments.wrapStandaloneSlcAsSlc = true

# ---------------------------------------------------------------------------
# Spacing
# ---------------------------------------------------------------------------
spaces.inImportCurlyBraces     = false
spaces.beforeContextBoundColon = IfMultipleBounds
spaces.afterSymbolicDefs       = true
spaces.afterTripleEquals       = true

literals.hexDigits  = Upper
literals.hexPrefix  = Lower
literals.long       = Upper
literals.float      = Lower
literals.double     = Lower
literals.scientific = Lower

trailingCommas = multiple   # required in multiline lists

# ---------------------------------------------------------------------------
# Project scope
# ---------------------------------------------------------------------------
project.git = true
project.excludePaths = [
  "glob:**/out/**"
  "glob:**/target/**"
  "glob:**/.metals/**"
  "glob:**/.bloop/**"
]

fileOverride {
  "glob:**/build.mill"    { runner.dialect = scala3 }
  "glob:**/package.mill"  { runner.dialect = scala3 }
  "glob:**/*.mill"        { runner.dialect = scala3 }
  "glob:**/*.sc"          { runner.dialect = scala3 }
}
